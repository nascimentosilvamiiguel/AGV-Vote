<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar — Grêmio Estudantil</title>
    <meta name="theme-color" content="#000435" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="../favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />
    <link rel="manifest" href="../assets/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Poppins:wght@400;600&family=Open+Sans:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/style.css" />
  </head>
  <body class="login-page" data-page="login">
    <main id="conteudo" class="login-main">
      <div class="login-box">
        <a href="home.html" aria-label="Voltar à página inicial">
          <img
            class="logo"
            src="../assets/logo.png"
            alt="Grêmio Estudantil"
            width="278"
            height="161"
          />
        </a>

        <form id="form" novalidate>
          <h1 class="sr-only" id="titulo">Entrar</h1>

          <label class="sr-only" for="email">E-mail</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="E-mail"
            required
          />

          <div id="campo-senha">
            <label class="sr-only" for="senha">Senha</label>
            <input
              id="senha"
              name="senha"
              type="password"
              autocomplete="current-password"
              placeholder="Senha"
              required
            />
          </div>

          <div id="campo-senha2" hidden>
            <label class="sr-only" for="senha2">Confirmar senha</label>
            <input
              id="senha2"
              name="senha2"
              type="password"
              autocomplete="new-password"
              placeholder="Confirmar senha"
            />
          </div>

          <button class="btn-login" id="enviar" type="submit">Login</button>

          <div class="login-links">
            <button type="button" id="alt-modo">Primeiro acesso</button>
            <button type="button" id="esqueci">Esqueceu a senha?</button>
          </div>

          <div id="msg" aria-live="polite"></div>
          <p class="login-demo">Use seu e-mail institucional (<span id="dominio"></span>).</p>
        </form>
      </div>
    </main>
    <script src="https://unpkg.com/pocketbase/dist/pocketbase.umd.js" defer></script>
    <script src="../pocketbase/root.js" defer></script>
    <script src="../pocketbase/api.js" defer></script>
    <script src="../scripts/app.js" defer></script>
    <script src="../pocketbase/login.js" defer></script>
  </body>
</html>
