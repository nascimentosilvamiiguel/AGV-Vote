<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Entrar — Grêmio Estudantil</title>
        <meta name="theme-color" content="#000435" />
        <meta name="robots" content="noindex" />
        <link rel="icon" href="../favicon.ico" sizes="any" />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="../assets/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="../assets/favicon-16x16.png"
        />
        <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />
        <link rel="manifest" href="../assets/site.webmanifest" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Poppins:wght@400;600&family=Open+Sans:wght@700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="../styles/style.css" />
    </head>
    <body class="login-page" data-page="login">
        <main id="conteudo" class="login-main">
            <div class="login-box">
                <a href="home.html" aria-label="Voltar à página inicial">
                    <img
                        class="logo"
                        src="../assets/logo.png"
                        alt="Grêmio Estudantil"
                        width="278"
                        height="161"
                    />
                </a>

                <div class="login-container">
                    <h1 class="sr-only" id="titulo">Entrar</h1>

                    <button
                        type="button"
                        class="btn-login btn-google"
                        id="btn-google"
                    >
                        Entrar com o Google
                    </button>

                    <div id="msg" aria-live="polite"></div>
                </div>
            </div>
        </main>
        <script
            src="https://unpkg.com/pocketbase/dist/pocketbase.umd.js"
            defer
        ></script>
        <script src="../pocketbase/root.js" defer></script>
        <script src="../pocketbase/api.js" defer></script>
        <script src="../scripts/app.js" defer></script>
        <script src="../pocketbase/login.js" defer></script>
    </body>
</html>
