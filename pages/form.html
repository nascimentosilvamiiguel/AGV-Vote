<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cadastrar chapa — Grêmio Estudantil</title>
    <meta name="theme-color" content="#000435" />
    <link rel="icon" href="../favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />
    <link rel="manifest" href="../assets/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Poppins:wght@400;600&family=Open+Sans:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/style.css" />
  </head>
  <body data-page="form" data-auth="required">
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <header id="site-header"></header>

    <main id="conteudo" class="light-page">
      <div class="page-title">
        <h1>Cadastre sua chapa</h1>
        <p>Apresente a chapa, as propostas e os integrantes</p>
      </div>
      <div class="container">
        <div class="banner info sem-permissao" id="sem-permissao" role="alert" hidden>
          Apenas líderes de chapa podem cadastrar chapas. Se você é líder, peça à comissão eleitoral
          para liberar o seu acesso. <a href="chapas.html">Ver as chapas</a>
        </div>

        <form class="form" id="form" novalidate>
          <div>
            <label for="name">Nome da chapa</label>
            <input id="name" name="name" type="text" maxlength="60" required aria-describedby="e-name" />
            <div class="err" id="e-name"></div>
          </div>
          <div>
            <label for="slogan">Slogan</label>
            <input id="slogan" name="slogan" type="text" maxlength="80" required aria-describedby="e-slogan" />
            <div class="err" id="e-slogan"></div>
          </div>
          <div>
            <label for="sobre">Sobre a chapa</label>
            <textarea id="sobre" name="sobre" maxlength="600" required aria-describedby="e-sobre"></textarea>
            <div class="err" id="e-sobre"></div>
          </div>
          <div>
            <label for="imagem">Logotipo (opcional)</label>
            <input id="imagem" name="imagem" type="file" accept="image/png,image/jpeg,image/webp" aria-describedby="e-imagem" />
            <div class="hint">PNG, JPG ou WEBP, até 2 MB. De preferência quadrada.</div>
            <div class="err" id="e-imagem"></div>
          </div>

          <fieldset>
            <legend>Propostas</legend>
            <div id="lista-propostas" style="display: grid; gap: 10px"></div>
            <button class="btn-add" id="add-proposta" type="button">Adicionar proposta</button>
            <div class="err" id="e-propostas"></div>
          </fieldset>

          <fieldset>
            <legend>Integrantes</legend>
            <div id="lista-integrantes" style="display: grid; gap: 10px"></div>
            <button class="btn-add" id="add-integrante" type="button">Adicionar integrante</button>
          </fieldset>

          <button class="btn" id="enviar" type="submit">Cadastrar chapa</button>
          <div id="resultado" aria-live="polite"></div>
        </form>
      </div>
    </main>

    <footer id="site-footer"></footer>
    <script src="https://unpkg.com/pocketbase/dist/pocketbase.umd.js" defer></script>
    <script src="../pocketbase/root.js" defer></script>
    <script src="../pocketbase/api.js" defer></script>
    <script src="../scripts/app.js" defer></script>
    <script src="../scripts/layout.js" defer></script>
    <script src="../pocketbase/form.js" defer></script>
  </body>
</html>
